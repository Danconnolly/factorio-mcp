[package]
name = "factorio-agent-rcon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
factorio-rcon = "=0.1.0"
factorio-agent-contract = { path = "../factorio-agent-contract" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["net", "sync", "time"] }

[dev-dependencies]
tempfile = "=3.24.0"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[lints]
workspace = true

[lib]
path = "src/lib.rs"
