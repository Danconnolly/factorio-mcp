[workspace]
members = [
  "crates/factorio-agent-contract",
  "crates/factorio-agent-rcon",
  "crates/factorio-agent-mcp",
  "crates/factorio-agent-testkit",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://codeberg.org/daniel/factorio-mcp"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
